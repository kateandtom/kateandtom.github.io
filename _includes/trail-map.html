{% if include.journal %}
  {% for post in site.posts %}
    {% if post.trip == 'Te Araroa' and post.latitude and post.longitude %}
      {% assign lat = post.latitude | plus: 0 %}{% assign lon = post.longitude | plus: 0 %}
      {% if lat >= -47.0 and lat <= -34.0 and lon >= 166.0 and lon <= 178.9 %}
        {% assign x = lon | minus: 166 | times: 34 %}{% assign y = -34 | minus: lat | times: 45 | plus: 15 %}
        <a class="journal-pin" href="{{ post.url | relative_url }}" aria-label="{{ post.title | escape }}{% if post.place %}, {{ post.place | escape }}{% endif %}">
          <title>{{ post.title | escape }}{% if post.place %} — {{ post.place | escape }}{% endif %}</title><circle class="journal-pin-target" cx="{{ x }}" cy="{{ y }}" r="11"/><circle class="journal-pin-dot" cx="{{ x }}" cy="{{ y }}" r="5"/>
        </a>
      {% endif %}
    {% endif %}
  {% endfor %}
{% else %}
  <circle id="map-dot-halo" class="map-dot-halo" r="8"/><circle id="map-dot" class="map-dot" r="4"/>
{% endif %}
